<script>
    // 1. Загрузка меток из URL (процедура с главной)
    window.addEventListener('load', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const source = urlParams.get('utm_source');
        const campaign = urlParams.get('utm_campaign');
        if (source) document.getElementById('utm_source').value = source;
        if (campaign) document.getElementById('utm_campaign').value = campaign;
    });

    // 2. Загрузка тарифов
    async function loadTariffs() {
        const select = document.getElementById('tariff-select');
        try {
            const response = await fetch('tariffs.csv');
            const data = await response.text();
            const rows = data.split('\n').slice(1);
            select.innerHTML = '<option value="" disabled selected>ВЫБЕРИТЕ ВАШ ТАРИФ</option>';
            rows.forEach(row => {
                const cols = row.split(';');
                if (cols.length >= 2) {
                    const opt = document.createElement('option');
                    opt.value = cols[1];
                    opt.textContent = `${cols[1]} — ${cols[2] || ''}`;
                    select.appendChild(opt);
                }
            });
        } catch (e) { select.innerHTML = '<option>Ошибка загрузки тарифов</option>'; }
    }
    loadTariffs();

    // 3. Та самая процедура отправки из index.html
    document.getElementById('thanks-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const scriptUrl = "https://script.google.com/macros/s/AKfycbxaEfwZ2itEJRIhon67qzy8mQbdM4XsMLYgX3KSoaiyiczc5Id7PDFq89TzYPTfzrY/exec";
        const btn = e.target.querySelector('button');
        
        btn.disabled = true;
        btn.textContent = "СИНХРОНИЗАЦИЯ...";

        // Формируем объект данных в точности как на главной
        const data = {
            full_name: document.getElementById('full_name').value,
            username: document.getElementById('username').value,
            product: document.getElementById('tariff-select').value,
            code: document.getElementById('code').value,
            notes: document.getElementById('notes').value,
            utm_source: document.getElementById('utm_source').value,
            utm_campaign: document.getElementById('utm_campaign').value,
            status: "Оплачено",
            source: "Страница успеха"
        };

        fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            document.getElementById('successSound').play();
            ym(108295607,'reachGoal','thanks_submit');
            
            document.getElementById('form-container').innerHTML = `
                <div style="padding: 25px; border: 2px solid #d4af37; border-radius: 15px; background: rgba(212,175,55,0.05);">
                    <h2 style="color:#d4af37; font-family: 'Cormorant Garamond', serif;">УСПЕШНО!</h2>
                    <p style="font-size: 1.2rem;">Данные вписаны в Книгу Рода.</p>
                    <a href="https://t.me/+jaFFa1ZEzpJmMTAy" class="gold-button">ВОЙТИ В ЧАТ</a>
                </div>`;
        })
        .catch(err => {
            console.error(err);
            alert("Ошибка связи. Напишите @alexeyevavv");
            btn.disabled = false;
            btn.textContent = "ПОДТВЕРДИТЬ";
        });
    });
</script>
