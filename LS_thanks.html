<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система активирована | Ловушка Суверена</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #000d1a; 
            color: #e0e0e0; 
            font-family: 'Cormorant Garamond', serif; 
            text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container { 
            border: 1px solid #c0c0c0; 
            padding: 50px; border-radius: 0; max-width: 700px;
            background: rgba(0, 13, 26, 0.9);
            box-shadow: inset 0 0 20px rgba(192, 192, 192, 0.1), 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #ffffff; font-size: 3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 30px; }
        p { font-size: 1.4rem; line-height: 1.6; margin-bottom: 25px; }
        .silver-button { 
            display: inline-block; padding: 20px 45px; margin: 10px;
            border: 1px solid #c0c0c0;
            background: transparent;
            color: #ffffff; text-decoration: none; 
            font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.4s;
        }
        .silver-button:hover { background: #c0c0c0; color: #000d1a; box-shadow: 0 0 20px rgba(192, 192, 192, 0.5); }
        .nft-note { color: #708090; font-style: italic; font-size: 1.1rem; margin-top: 40px; border-top: 1px solid #2d3e50; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>СИСТЕМА АКТИВИРОВАНА</h1>
        <p>Доступ к материалам «Ловушки Суверена» открыт. Интеграция прошла успешно.</p>
        
        <a href="https://drive.google.com/drive/folders/1_ASo5tI1K5hQilgpJbzpQrtFyFaRRdKF" class="silver-button" target="_blank">ПОЛУЧИТЬ МАТЕРИАЛЫ</a>

        <div class="nft-note">
            <p>Чтобы забрать свою NFT, отправьте адрес кошелька в наш системный бот:</p>
            <a href="https://t.me/SovereignTrapBot?start=robocassa" style="color: #c0c0c0; text-decoration: underline;">ОТПРАВИТЬ КОШЕЛЕК</a>
        </div>
    </div>
</body>
</html>
