<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://yastatic.net; connect-src 'self' https://mc.yandex.ru https://yastatic.net; media-src 'self' blob: https://*.suno.ai;">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Врата Тайн | Секретный Архив Фрэнка</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --deep-green: #001a11;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: var(--deep-green); 
            font-family: 'Cormorant Garamond', serif; 
            color: var(--gold);
        }

        .coming-soon-bg { 
            position: fixed; inset: 0; 
            background: url('coming-soon-underground.png') no-repeat center center; 
            background-size: cover; 
            z-index: 1; 
        }

        /* КНОПКА ЗВУКА (как на основном сайте) */
        #music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            cursor: pointer;
            background: rgba(0, 26, 17, 0.6);
            border: 1px solid var(--gold);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        #music-control:hover {
            box-shadow: 0 0 20px var(--gold);
            transform: scale(1.1);
        }

        #music-control svg {
            fill: var(--gold);
            width: 24px;
            height: 24px;
        }

        #countdown {
            position: fixed; top: 40px; width: 100%; text-align: center;
            font-size: 3.5rem; font-weight: bold; letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            z-index: 10;
        }

        #lock {
            width: 450px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.8));
        }

        #escapist-key {
            width: 300px;
            position: absolute;
            z-index: 100;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            top: 70%; left: 20%;
        }

        .manifesto {
            position: fixed; bottom: 30px; width: 100%; text-align: center;
            font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            z-index: 10; padding: 0 20px; box-sizing: border-box;
        }

        @media (max-width: 768px) {
            #lock { width: 80%; max-width: 300px; }
            #escapist-key { width: 150px; }
            #countdown { font-size: 1.8rem; top: 20px; }
            #music-control { top: 10px; right: 10px; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="coming-soon-bg"></div>
    <div id="countdown"></div>
    
    <div id="music-control" onclick="toggleMusic()">
        <svg id="icon-on" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.01,19.86 21,16.28 21,12C21,7.72 18.01,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
        <svg id="icon-off" viewBox="0 0 24 24" style="display:none;"><path d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18.01,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.48,12.43 16.5,12.22 16.5,12Z"/></svg>
    </div>

    <img src="lock-secret.png" id="lock" alt="Замок Секрета">
    <img src="key-archivist.png" id="escapist-key" alt="Ключ Архивариуса">

    <audio id="bg-music" loop>
        <source src="mystic-celtic.mp3" type="audio/mpeg">
    </audio>

    <div class="manifesto">
        РАЗБЕЙ ОКОВЫ ПСЕВДО ПРАВОВЫХ ИЛЛЮЗИЙ, НАЙДИ РЕАЛЬНЫЕ ФАКТЫ В КОНГЛОМЕРАТЕ ИНФОРМАЦИОННОГО ШУМА
    </div>

    <script>
        // 1. ТАЙМЕР (остался прежним)
        const targetDate = new Date("2026-06-21 23:59:59").getTime();
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const display = document.getElementById("countdown");
            if (distance < 0) { display.innerHTML = "АРХИВ ОТКРЫТ"; return; }
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            const format = (n) => n < 10 ? '0'+n : n;
            display.innerHTML = `${days}д : ${format(hours)}ч : ${format(minutes)}м : ${format(seconds)}с`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. ЛОГИКА МУЗЫКИ И КЛЮЧА
        const key = document.getElementById('escapist-key');
        const audio = document.getElementById('bg-music');
        const iconOn = document.getElementById('icon-on');
        const iconOff = document.getElementById('icon-off');
        let musicStarted = false;
        let isMuted = false;

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                isMuted = false;
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
            } else {
                audio.pause();
                isMuted = true;
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            }
        }

        function moveKey() {
            // Запуск музыки при первой попытке схватить ключ
            if (!musicStarted) {
                audio.play().catch(() => {
                    console.log("Ждем клика пользователя для активации звука");
                });
                musicStarted = true;
            }

            const padding = 100;
            const maxX = window.innerWidth - key.clientWidth - padding;
            const maxY = window.innerHeight - key.clientHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            key.style.left = randomX + 'px';
            key.style.top = randomY + 'px';
        }

        key.addEventListener('mouseenter', moveKey);
        key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveKey();
        });
    </script>
</body>
</html>
